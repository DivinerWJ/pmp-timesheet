name: Build & Release

# 推送 v* 标签：四平台并行构建 → tauri-action 创建 Release 并上传产物 → 汇总生成 latest.json
# 更新清单里包含 windows-x86_64 / darwin-aarch64 / darwin-x86_64 三个平台的条目，
# 客户端按自身编译时的 target 取对应那条。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包签名私钥（Ed25519）：Settings → Secrets → Actions
          # 内容为 src-tauri/.updater/pmp-timesheet.key 的完整文本。
          # 没有它就不会生成 .sig，自动更新无法工作。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 注意：这里**不能**写 APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY 之类的变量。
          # tauri-bundler 用 var_os() 判断「是否提供证书」——变量存在但值为空串时返回
          # Some("")，会被当成「给了一张证书」，拿空 base64 去 security import 直接失败：
          #   failed to bundle project: error running bundle_dmg.sh / 导入证书失败
          # 未配置 Apple 证书时让变量保持「未定义」，mac 走 ad-hoc 签名即可。
          # 等真正买了 Apple Developer 再按下面的方式补（且必须用 secrets 判空，不能给空串）：
          #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
        with:
          # 不在这里创建 Release：各平台并行上传会互相覆盖 latest.json，
          # 统一由下面的 manifest job 生成
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pmp-timesheet-${{ matrix.label }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/nsis/*.sig
            src-tauri/target/*/release/bundle/macos/*.tar.gz
            src-tauri/target/*/release/bundle/macos/*.sig
          if-no-files-found: ignore

  # 汇总更新清单：各平台产物 + signature 合成一份 latest.json
  #
  # Release 完全由本 job 负责创建与上传（tauri-action 在没有 tagName 时不会建 Release，
  # 之前依赖它 + softprops 的结果是一个空壳 Release，latest.json 因缺产物而失败）。
  manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载各平台构建产物
        uses: actions/download-artifact@v4
        with:
          # 每个平台的产物落在 dist/<artifact名>/ 下，保留平台信息：
          # macOS 两个架构的更新包同名，必须在各自的目录里才能区分
          path: dist
          pattern: pmp-timesheet-*

      - name: 校验版本号一致
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          if [ "v$CONF" != "$TAG" ] || [ "$PKG" != "$CONF" ]; then
            echo "::error::版本号不一致 —— tag=$TAG tauri.conf=$CONF package.json=$PKG，请先统一版本号再打标签"
            exit 1
          fi

      - name: 按架构重命名 macOS 更新包
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("dist")
          ver = json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"]

          # tauri 生成的 macOS 更新包固定叫 "<产品名>.app.tar.gz"，不带版本与架构。
          # 两个架构同名 -> 会上传时互相覆盖，latest.json 也没法区分，必须改名。
          arch_of = {"pmp-timesheet-macos-arm64": "aarch64", "pmp-timesheet-macos-intel": "x64"}
          for folder, arch in arch_of.items():
              base = root / folder
              if not base.is_dir():
                  continue
              for f in sorted(base.rglob("*")):
                  if not f.is_file() or not f.name.endswith(".app.tar.gz"):
                      continue
                  target = f.with_name(f"PMP-Timesheet_{ver}_{arch}.app.tar.gz")
                  if f != target:
                      f.rename(target)
                      print(f"rename {f.name} -> {target.name}")
                  sig = f.with_name(f.name + ".sig")
                  if sig.exists():
                      sig.rename(f.with_name(target.name + ".sig"))
                      print(f"rename {sig.name} -> {target.name}.sig")

          for f in sorted(root.rglob("*")):
              if f.is_file():
                  print(" ", f.relative_to(root))
          PY

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="各平台安装包见下方 Assets。应用内「检查更新」会拉取 latest.json 自动升级。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "PMP 工时 $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "PMP 工时 $TAG" --notes "$NOTES"
          fi
          # 逐个上传：单文件失败不中断其余文件，且能明确指出是哪个文件出问题
          fail=0
          while IFS= read -r -d '' f; do
            name=$(basename "$f")
            echo "→ $name"
            if ! gh release upload "$TAG" "$f" --clobber; then
              echo "::error::上传失败：$name"
              fail=1
            fi
          done < <(find dist -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          # 清理本轮不该存在的旧资产（例如上一轮同名覆盖残留的 PMP.Timesheet.app.tar.gz）
          find dist -type f -printf '%f\n' | sed 's/ /./g' | sort -u > expected.txt
          gh release view "$TAG" --json assets -q '.assets[].name' > actual.txt
          while IFS= read -r name; do
            if [ -z "$name" ]; then
              continue
            fi
            if ! grep -Fxq "$name" expected.txt; then
              echo "清理旧资产：$name"
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done < actual.txt

      - name: 生成 latest.json 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import subprocess

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]

          def gh(*args):
              return subprocess.check_output(["gh", *args])

          release = json.loads(gh("api", f"repos/{repo}/releases/tags/{tag}"))
          assets = {a["name"]: a for a in release["assets"]}

          def sig_text(asset_id):
              # 只取签名文件内容（几百字节），不下载安装包本体
              raw = gh(
                  "api",
                  f"repos/{repo}/releases/assets/{asset_id}",
                  "-H",
                  "Accept: application/octet-stream",
              )
              return raw.decode("utf-8").strip()

          # 资产名 → 平台 key（客户端按编译时的 target 匹配对应条目）
          matchers = {
              "windows-x86_64": lambda n: n.endswith("-setup.exe"),
              # macOS 更新包已在「按架构重命名」步骤改成 ..._aarch64.app.tar.gz / ..._x64.app.tar.gz
              "darwin-aarch64": lambda n: n.endswith("_aarch64.app.tar.gz"),
              "darwin-x86_64": lambda n: n.endswith("_x64.app.tar.gz"),
          }

          platforms = {}
          missing = []
          for key, match in matchers.items():
              name = next((n for n in assets if match(n)), None)
              if not name:
                  missing.append(key)
                  continue
              sig = assets.get(name + ".sig")
              if sig is None:
                  missing.append(key + " .sig")
                  continue
              platforms[key] = {
                  "signature": sig_text(sig["id"]),
                  "url": assets[name]["browser_download_url"],
              }

          if missing:
              raise SystemExit(
                  "::error::缺少产物，无法生成完整更新清单: " + ", ".join(missing)
              )

          manifest = {
              "version": version,
              "notes": release.get("body") or f"PMP 工时 v{version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              ),
              "platforms": platforms,
          }
          pathlib.Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          gh release upload "${GITHUB_REF_NAME}" latest.json --clobber
