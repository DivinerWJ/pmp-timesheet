[package]
name = "pmp-timesheet"
version = "2.1.0"
description = "PMP Timesheet — Tauri 2.0 跨平台应用"
authors = ["DivinerWJ"]
edition = "2021"

[lib]
name = "pmp_timesheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
dirs = "6"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
